# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Challenge_3"
  authors: [Kenny Lau]
  description: >
    `Challenge_3` is a formal proof of the appendix results of *Dominant Zeros of
    Nekrasov-Okounkov Polynomials* (arXiv:2606.15394). Writing $q_n$ for the coefficients of
    $Q(t) = 1 - P(t)S(t)$ and $X^{\pm}_N$ for the even- and odd-area marked rectangles, it proves
    the signed count $q_n = |X^+_N| - |X^-_N|$ of Lemma B.2, the injection
    $X^-_N \hookrightarrow X^+_N$ of Lemma B.3, the nonnegativity $q_n \ge 0$ of Theorem B.1, and
    the strict positivity of the coefficients of $1/S(t)$ of Corollary B.4. The Lean files were
    generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Dominant Zeros of Nekrasov--Okounkov Polynomials"
    authors: [Bernhard Heim, Markus Neuhauser, with an appendix by Ken Ono]
    id: "https://arxiv.org/abs/2606.15394"
    type: "article"
    location: "Theorem B.1, Lemma B.2, Lemma B.3, Corollary B.4"
    relationship: "formalizes"
    note: >
      Formalizes the appendix, in two runs: `lemma-b2` for the signed count and the injection it
      feeds, and `lemma-b3` for the positivity corollary.

classification:
  arxiv: [math.CO, math.NT]

status:
  scope: >
    Lemma B.2, Lemma B.3 and Theorem B.1 for every $n \ge 1$, in the `lemma_b2` run, and
    Corollary B.4 for every $m \ge 0$, in the `lemma_b3` run. The `lemma_b3` run restates and
    reproves Lemma B.2, Lemma B.3 and Theorem B.1 in its own module, since it was given them as
    input.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "ColoredRectangles.q_signed_count"
    file: "Challenge_3/lemma_b2/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-lemma_b2.json"
  - declaration: "ColoredRectangles.injection"
    file: "Challenge_3/lemma_b2/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-lemma_b2.json"
  - declaration: "ColoredRectangles.qn_nonneg"
    file: "Challenge_3/lemma_b2/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-lemma_b2.json"
  - declaration: "ColoredRectangles.cQ_pos"
    file: "Challenge_3/lemma_b3/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-lemma_b3.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `Challenge_3/lemma_b2/problem.lean` and
    `Challenge_3/lemma_b3/problem.lean` was checked against the source paper by an author of that
    paper.

alignment:
  statements:
    - source: "Dominant Zeros of Nekrasov--Okounkov Polynomials (Lemma B.2)"
      lean: "ColoredRectangles.q_signed_count"
      module: "Challenge_3.lemma_b2.solution"
      status: "Proved."
    - source: "Dominant Zeros of Nekrasov--Okounkov Polynomials (Lemma B.3)"
      lean: "ColoredRectangles.injection"
      module: "Challenge_3.lemma_b2.solution"
      status: "Proved, as the existence of an injection rather than the explicit $\\iota_N$."
    - source: "Dominant Zeros of Nekrasov--Okounkov Polynomials (Theorem B.1)"
      lean: "ColoredRectangles.qn_nonneg"
      module: "Challenge_3.lemma_b2.solution"
      status: "Proved."
    - source: "Dominant Zeros of Nekrasov--Okounkov Polynomials (Corollary B.4)"
      lean: "ColoredRectangles.cQ_pos"
      module: "Challenge_3.lemma_b3.solution"
      status: "Proved."
